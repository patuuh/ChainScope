# nginx.conf
# Simple reverse proxy with TLS termination for ChainScope RAG API
# Place this file in the project root and use it with an Nginx container or installed Nginx.
# Update the paths to your TLS certificate and key.

events {}
http {
    # Load SSL certificates (replace with your actual files)
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    server {
        listen 443 ssl;
        server_name _;  # replace with your domain

        # Uncomment the lines above after placing your certs.

        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Optional HTTP to HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
